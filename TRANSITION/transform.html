<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        div {
        width: 150px;
        height: 150px;
        background-color: yellow;
        border: 1px solid black;
        transition: width 2s, height 2s, background 2s, transform 5s;
        }
        div:hover{
            width: 300px;
            height: 300px;
            background-color:pink;
            transform: rotate(360deg);
        }
    </style>
</head>
<body>
    <div>
        The box can rotate.
    </div>
</body>
</html>
