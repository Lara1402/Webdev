<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* The animation code */
        @keyframes myAnimation {
            /* 0%   {background-color: plum;}
            25%  {background-color: palevioletred;} */
            from  {background-color: rgb(171, 123, 220); left:0px; top:0px;}
            to {background-color: pink; left:500px; top:0px;}
        }

        /* The element to apply the animation to */
        div {
            width: 200px;
            height: 200px;
            background-color: plum;
            position: relative;
            animation: myAnimation 4s infinite;
            /* animation-duration: 4s; */
        }
        /* div:hover{
            animation-name: myAnimation;
            animation-duration: 4s;
        } */
    </style>
</head>
<body>
    <div></div>
</body>
</html>
